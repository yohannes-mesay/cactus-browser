[workspace]
resolver = "2"
members = [
    "crates/cactus",
    "crates/cactus-core",
    "crates/cactus-ui",
    "crates/cactus-privacy",
    "crates/cactus-webkit",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MPL-2.0"
authors = ["Cactus Contributors"]
repository = "https://github.com/cactus-browser/cactus"

[workspace.dependencies]
cactus-core = { path = "crates/cactus-core" }
cactus-ui = { path = "crates/cactus-ui" }
cactus-privacy = { path = "crates/cactus-privacy" }
cactus-webkit = { path = "crates/cactus-webkit" }

gtk4 = { version = "0.9", features = ["v4_14"] }
libadwaita = { version = "0.7", features = ["v1_5"] }
glib = "0.20"
gio = "0.20"
gdk4 = "0.9"
webkit6 = { version = "0.4", features = ["v2_44"] }
soup3 = "0.5"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
directories = "5"
thiserror = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"
once_cell = "1"
parking_lot = "0.12"
log = "0.4"
env_logger = "0.11"
adblock = "0.9"
ureq = { version = "2", default-features = true, features = ["tls"] }
rayon = "1"
rmp = "=0.8.14"
